name: Kanban
options:
  bundleIdPrefix: com.kanban
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: $(TARGET_NAME)
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GCC_NO_COMMON_BLOCKS: YES
    CLANG_ENABLE_OBJC_WEAK: YES
    # Local development signing: ad-hoc, no provisioning profile, no App Group.
    # Swap CODE_SIGN_IDENTITY/DEVELOPMENT_TEAM for a real identity to notarise.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      GCC_OPTIMIZATION_LEVEL: s
      LLVM_LTO: YES_THIN
      STRIP_INSTALLED_PRODUCT: YES
      DEPLOYMENT_POSTPROCESSING: YES
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ONLY_ACTIVE_ARCH: YES

packages:
  TranscribeCpp:
    path: Vendor/TranscribeCpp

targets:
  Kanban:
    type: application
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/Kanban
      - path: Resources/Kanban/AppIcon.icns
        buildPhase: resources
      - path: Resources/Kanban/catalog.json
        buildPhase: resources
    dependencies:
      - target: KanbanWidget
      - package: TranscribeCpp
        product: TranscribeCpp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kanban.app
        INFOPLIST_FILE: Resources/Kanban/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Kanban/Kanban.entitlements
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    preBuildScripts: []

  KanbanWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/Shared/Core/Models
      - path: Sources/Shared/Design
      - path: Sources/Shared/Snapshot
      - path: Sources/Shared/Core/Database/Paths.swift
      - path: Sources/KanbanWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kanban.app.widget
        INFOPLIST_FILE: Resources/KanbanWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/KanbanWidget/KanbanWidget.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../../../../Frameworks"

  KanbanTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/Kanban/Meetings/Recording/AudioCaptureEngine.swift
      - path: Sources/Kanban/Meetings/Recording/AudioFileWriter.swift
      - path: Sources/Kanban/Meetings/Recording/MeetingRecorder.swift
      - path: Sources/Kanban/Settings/AppSettings.swift
      - path: Sources/Kanban/Core/Authentication/KeychainStore.swift
      - path: Sources/Kanban/Core/AI/GeminiClient.swift
      - path: Sources/Kanban/Core/AI/LocalAgentPlan.swift
      - path: Sources/Kanban/Core/Transcription
      - path: Sources/Kanban/Dictation/DictationSilenceDetector.swift
      - path: Resources/Kanban/catalog.json
        buildPhase: resources
      - path: Sources/Kanban/Meetings/Recording/SystemAudioCaptureEngine.swift
      - path: Tests/KanbanCoreTests
    dependencies:
      - package: TranscribeCpp
        product: TranscribeCpp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kanban.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Kanban:
    build:
      targets:
        Kanban: all
        KanbanWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KanbanTests
    archive:
      config: Release
  KanbanTests:
    build:
      targets:
        KanbanTests: [test]
    test:
      config: Debug
      targets:
        - KanbanTests
